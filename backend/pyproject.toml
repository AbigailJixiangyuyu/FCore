[project]
name = "temporal-graph-demo-backend"
version = "0.1.0"
description = "时序交易图分析 Demo 的接口与算法服务"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi[standard]==0.162.5",
    "httpx>=0.28.1,<1",
    "numpy>=1.26,<3",
    "pydantic>=2,<3",
    "python-dotenv>=1.2,<2",
    "torch==2.8.0",
]

[tool.uv]
package = false
# Windows development uses the base interpreter's cu128 wheel. The Linux
# deployment installs the matching CPU wheel explicitly.
exclude-dependencies = ["torch"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["hardware: exercise CUDA training and inference or the WSL adapter"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
